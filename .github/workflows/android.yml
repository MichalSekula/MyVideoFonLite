name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # Klucze Tuya i klucz podpisu pochodzą z sekretów repozytorium (Settings → Secrets and variables → Actions).
      # Nic z tego nie trafia do kodu. Gdy sekretów brak, budowa działa dalej (tryb demo, klucz debug).
      - name: Konfiguracja z sekretów
        env:
          TUYA_APP_KEY: ${{ secrets.TUYA_APP_KEY }}
          TUYA_APP_SECRET: ${{ secrets.TUYA_APP_SECRET }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          printf 'tuya.appKey=%s\ntuya.appSecret=%s\n' "$TUYA_APP_KEY" "$TUYA_APP_SECRET" > local.properties
          if [ -n "$TUYA_APP_KEY" ] && [ -n "$TUYA_APP_SECRET" ]; then echo "Klucze Tuya: ustawione"; else echo "Klucze Tuya: BRAK"; fi
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            # Tekst wklejony z PowerShell bywa z odstępami lub znakami końca linii – pomijamy je.
            if ! printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > signing.jks || [ ! -s signing.jks ]; then
              echo "::error::SIGNING_KEYSTORE_BASE64 nie jest poprawnym tekstem base64 pliku .jks."
              exit 1
            fi
            STORE_PW=$(printf '%s' "$SIGNING_STORE_PASSWORD" | tr -d '\r\n')
            KEY_PW=$(printf '%s' "$SIGNING_KEY_PASSWORD" | tr -d '\r\n')
            ALIAS=$(printf '%s' "$SIGNING_KEY_ALIAS" | tr -d ' \r\n')
            if ! keytool -list -keystore signing.jks -storepass "$STORE_PW" -alias "$ALIAS" > /dev/null 2>&1; then
              echo "::error::Nie da się otworzyć klucza: sprawdź SIGNING_STORE_PASSWORD i SIGNING_KEY_ALIAS (alias: myvideofonlite)."
              exit 1
            fi
            # Odcisk SHA-256 jest publiczny – to ten sam, który wpisuje się w panelu Tuya.
            keytool -list -v -keystore signing.jks -storepass "$STORE_PW" -alias "$ALIAS" | grep -m1 'SHA256:' | sed 's/^[[:space:]]*/Odcisk klucza: /'
            printf 'signing.storeFile=signing.jks\nsigning.storePassword=%s\nsigning.keyAlias=%s\nsigning.keyPassword=%s\n' \
              "$STORE_PW" "$ALIAS" "$KEY_PW" >> local.properties
            echo "APK podpisane stałym kluczem."
          else
            echo "Brak SIGNING_KEYSTORE_BASE64 – APK podpisane tymczasowym kluczem debug."
          fi

      - name: Plik bezpieczeństwa Tuya (odszyfrowanie)
        env:
          TUYA_SECURITY_PASSPHRASE: ${{ secrets.TUYA_SECURITY_PASSPHRASE }}
        run: |
          if [ -n "$TUYA_SECURITY_PASSPHRASE" ]; then
            mkdir -p app/libs
            gpg --batch --yes --pinentry-mode loopback --passphrase "$TUYA_SECURITY_PASSPHRASE" \
              -o app/libs/security-algorithm.aar -d app/libs-encrypted/security-algorithm.aar.gpg
            echo "Plik bezpieczeństwa Tuya: odszyfrowany"
          else
            echo "Plik bezpieczeństwa Tuya: BRAK sekretu TUYA_SECURITY_PASSPHRASE"
          fi

      - name: Testy jednostkowe
        run: ./gradlew :domain:test :app:testDebugUnitTest --stacktrace

      - name: Budowa APK (debug)
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: MyVideoFonLite-debug-apk
          path: app/build/outputs/apk/debug/*.apk
