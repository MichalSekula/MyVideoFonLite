name: Inspekcja API Tuya SDK

on:
  push:
    branches: [ feature/tuya-sdk ]
    paths: [ '.github/workflows/tuya-api.yml', 'gradle/libs.versions.toml', 'app/build.gradle.kts' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Pobranie klas SDK
        run: ./gradlew :app:dumpTuyaJars --stacktrace
      - name: Indeks klas i sygnatury
        run: |
          mkdir -p api
          cd app/build/tuyajars
          ls -la > ../../../api/jars.txt
          for j in *.jar; do unzip -Z1 "$j" | grep '\.class$' | sed "s#^#$j: #" ; done > ../../../api/classes.txt
          cd ../../..
          PATTERN='(ThingHomeSdk|ThingIPCSdk|IThingSmartCameraP2P|ThingCameraView|OperationDelegateCallBack|ILoginCallback|ILogoutCallback|IThingUser|IThingHomeManager|IThingGetHomeListCallback|IThingHome|IThingHomeResultCallback|HomeBean|DeviceBean|SchemaBean|IThingDevice|IDevListener|IResultCallback|AbsP2pCameraListener|IThingIPCCore|ICameraP2P|IRegisterCallback|IThingCameraMessage|IThingIPCDoorBellManager|DoorBell|IThingIPCDpHelper|IThingCameraView|AbsConnectCallBack|ThingSmartSdk|ThingSdk|AbsVideoViewCallback|INeedLoginListener|IThingHomeDataManager|IUserCommonPlugin|IUser|OnP2PCameraListener|User|IThingDeviceActivator|IThingActivatorGetToken|IThingCameraDevActivator|ActivatorModelEnum|ActivatorBuilder|ThingCameraActivatorBuilder|IThingActivator|IThingSmartActivatorListener|IThingSmartCameraActivatorListener|IThingHomeManager|IThingHomeCamera)\.class$'
          grep -E "$PATTERN" api/classes.txt | grep -v '\$' > api/selected.txt || true
          : > api/javap.txt
          while IFS= read -r line; do
            jar="${line%%: *}"; cls="${line#*: }"; cls="${cls%.class}"; cls="${cls//\//.}"
            echo "=== $cls ($jar)" >> api/javap.txt
            javap -public -cp "app/build/tuyajars/$jar" "$cls" >> api/javap.txt 2>&1 || true
          done < api/selected.txt
          wc -l api/*
      - name: Publikacja na gałęzi ci-tuya-api
        run: |
          cd api
          git init -q -b ci-tuya-api
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "API Tuya SDK"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-tuya-api
