name: Zrzuty ekranu (emulator)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Budowa APK aplikacji i testu
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Włącz KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator + zrzuty ekranu
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e prefix jasny_ -e class pl.sekula.myvideofonlite.ScreenshotTour pl.gbc.myvideofonlite.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.log
            mkdir -p screenshots && adb pull /sdcard/Android/data/pl.gbc.myvideofonlite/files/screenshots/. screenshots/ || true
            adb shell pm clear pl.gbc.myvideofonlite
            adb shell am instrument -w -e prefix ciemny_ -e class pl.sekula.myvideofonlite.ScreenshotTour pl.gbc.myvideofonlite.test/androidx.test.runner.AndroidJUnitRunner | tee -a instrument.log
            adb pull /sdcard/Android/data/pl.gbc.myvideofonlite/files/screenshots/. screenshots/ || true
            test "$(grep -c 'OK (1 test)' instrument.log)" = "2"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshots
          path: |
            screenshots/
            instrument.log

      - name: Publikacja zrzutów na gałęzi ci-screenshots
        if: always()
        run: |
          [ -d screenshots ] || exit 0
          cp instrument.log screenshots/ 2>/dev/null || true
          cd screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Zrzuty ekranu z ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
