name: Zrzuty ekranu (emulator)

on:
  pull_request:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Budowa APK aplikacji i testu
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Włącz KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator + zrzuty ekranu
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class pl.sekula.myvideofonlite.ScreenshotTour pl.sekula.myvideofonlite.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.log
            mkdir -p screenshots && adb pull /sdcard/Android/data/pl.sekula.myvideofonlite/files/screenshots/. screenshots/ || true
            grep -q "OK (1 test)" instrument.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            screenshots/
            instrument.log
